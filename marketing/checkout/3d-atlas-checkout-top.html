<style>
  /* === Brand tokens === */
  .cf-co-header-root {
    --blue: #1A6BFF;
    --blue-dark: #0F4FCC;
    --blue-deep: #060D2E;
    --gold: #E89B0A;
    --gold-dark: #C77700;
    --green: #16A34A;
    --green-dark: #15803D;
    --bg-soft: #F7F9FC;
    --bg-tint: #EEF4FF;
    --border: #E5EAF2;
    --text: #060D2E;
    --text-muted: #5B6B8A;
  }
  /* === Reset === */
  .cf-co-header-root * { margin: 0; padding: 0; box-sizing: border-box; }
  .cf-co-header-root { font-family: Arial, Helvetica, sans-serif; }
  /* === Wrapper === */
  .cf-co-header {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 16px;
  }
  /* === Countdown banner (gold for urgency) === */
  .cf-co-countdown {
    background: var(--gold);
    color: #fff !important;
    text-align: center;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    border: 2px solid var(--gold-dark);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    box-shadow: 0 2px 0 var(--gold-dark);
  }
  .cf-co-countdown span, .cf-co-countdown strong { color: #fff !important; }
  .cf-co-countdown-time {
    background: rgba(0,0,0,0.22);
    padding: 4px 12px;
    border-radius: 5px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    letter-spacing: 0.05em;
    font-size: 15px;
    min-width: 96px;
    display: inline-block;
    color: #fff !important;
  }
  /* === Progress steps === */
  .cf-co-steps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .cf-co-step {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: bold;
  }
  .cf-co-step-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    flex-shrink: 0;
    border: 2px solid var(--border);
  }
  .cf-co-step-label { color: var(--text-muted); }
  .cf-co-step.completed .cf-co-step-num {
    background: var(--green);
    color: #fff;
    border-color: var(--green-dark);
  }
  .cf-co-step.completed .cf-co-step-label { color: var(--green-dark); }
  .cf-co-step.active .cf-co-step-num {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue-dark);
    box-shadow: 0 0 0 4px rgba(26,107,255,0.18);
  }
  .cf-co-step.active .cf-co-step-label { color: var(--blue); }
  .cf-co-step-divider {
    width: 50px;
    height: 2px;
    background: var(--border);
    border-radius: 1px;
  }
  /* === Title block === */
  .cf-co-title-block {
    text-align: center;
    margin-bottom: 18px;
  }
  .cf-co-title-block h1 {
    font-size: 30px;
    font-weight: bold;
    color: var(--blue-deep);
    margin: 0 0 8px;
    line-height: 1.2;
  }
  .cf-co-title-block h1 .hl-blue {
    background: #FFE082;
    color: var(--blue-deep);
    padding: 2px 8px;
  }
  .cf-co-title-block p {
    font-size: 16px;
    color: var(--text-muted);
    margin: 0;
    font-weight: normal;
  }
  /* === Trust pills === */
  .cf-co-trust-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .cf-co-trust-pill {
    background: #F4FFF4;
    color: var(--green-dark);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 2px solid var(--green);
  }
  .cf-co-trust-pill.blue {
    background: var(--bg-tint);
    color: var(--blue);
    border-color: var(--blue);
  }
  .cf-co-trust-pill.gold {
    background: #FFF8E5;
    color: var(--gold-dark);
    border-color: var(--gold);
  }
  /* === Mobile === */
  @media (max-width: 768px) {
    .cf-co-header { padding: 0 10px; margin: 16px auto; }
    .cf-co-countdown {
      font-size: 13px;
      padding: 10px 12px;
      gap: 8px;
      margin-bottom: 18px;
    }
    .cf-co-countdown-time { font-size: 13px; min-width: 84px; padding: 3px 10px; }
    .cf-co-steps {
      gap: 6px;
      margin-bottom: 20px;
    }
    .cf-co-step-divider { width: 18px; }
    .cf-co-step-label { display: none; }
    .cf-co-step-num { width: 30px; height: 30px; font-size: 13px; }
    .cf-co-title-block h1 { font-size: 22px; }
    .cf-co-title-block p { font-size: 14px; }
    .cf-co-trust-pill { font-size: 12px; padding: 6px 10px; }
  }
</style>
<div class="cf-co-header-root">
  <div class="cf-co-header">
    <div class="cf-co-countdown">
      <span>🔥 Your 80% discount expires in:</span>
      <span class="cf-co-countdown-time" id="cf-co-cd">02:34:11</span>
      <span>Don't miss out!</span>
    </div>
    <div class="cf-co-steps">
      <div class="cf-co-step completed">
        <span class="cf-co-step-num">✓</span>
        <span class="cf-co-step-label">Email Captured</span>
      </div>
      <div class="cf-co-step-divider"></div>
      <div class="cf-co-step active">
        <span class="cf-co-step-num">2</span>
        <span class="cf-co-step-label">Secure Checkout</span>
      </div>
      <div class="cf-co-step-divider"></div>
      <div class="cf-co-step">
        <span class="cf-co-step-num">3</span>
        <span class="cf-co-step-label">Instant Access</span>
      </div>
    </div>
    <div class="cf-co-title-block">
      <h1>You're one step from <span class="hl-blue">the whole body in 3D</span></h1>
      <p>Complete your order below to unlock the atlas and all 22 subjects instantly</p>
    </div>
    <div class="cf-co-trust-row">
      <span class="cf-co-trust-pill blue">🔒 256-bit SSL Encrypted</span>
      <span class="cf-co-trust-pill">✓ 30-Day Money-Back</span>
      <span class="cf-co-trust-pill gold">⚡ Instant Access</span>
    </div>
  </div>
</div>
<script>
  // Persistent countdown syncs with the atlas sales page via the same localStorage key
  (function() {
    var banner = document.getElementById('cf-co-cd');
    if (!banner) return;
    var KEY = 'msz_atlas_countdown_end';
    var DURATION = (3 * 60 * 60 + 4 * 60 + 33) * 1000;
    var endTime = 0;
    try { endTime = parseInt(localStorage.getItem(KEY) || '0', 10); } catch (e) {}
    var now = Date.now();
    if (!endTime || now >= endTime) {
      endTime = now + DURATION;
      try { localStorage.setItem(KEY, endTime.toString()); } catch (e) {}
    }
    function tick() {
      var remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      var h = Math.floor(remaining / 3600);
      var m = Math.floor((remaining % 3600) / 60);
      var s = remaining % 60;
      banner.textContent =
        String(h).padStart(2, '0') + ':' +
        String(m).padStart(2, '0') + ':' +
        String(s).padStart(2, '0');
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
