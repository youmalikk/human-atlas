<style>
  /* === Brand tokens === */
  .cf-header-root {
    --blue: #1A6BFF;
    --blue-dark: #0F4FCC;
    --blue-deep: #060D2E;
    --gold: #E89B0A;
    --gold-dark: #C77700;
    --bg-soft: #F7F9FC;
    --border: #E5EAF2;
    --text: #060D2E;
    --text-muted: #5B6B8A;
  }
  /* === Reset === */
  .cf-header-root * { margin: 0; padding: 0; box-sizing: border-box; }
  .cf-header-root { font-family: Arial, Helvetica, sans-serif; }
  /* === Header wrapper === */
  .cf-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 250;
    transition: transform 0.3s ease;
    transform: translateY(0);
  }
  .cf-header.scrolled {
    transform: translateY(calc(var(--cf-bar-h, 44px) * -1));
  }
  .cf-header.nav-hidden {
    transform: translateY(-200%) !important;
  }
  /* === Announcement bar (gold for urgency) === */
  .cf-bar {
    background: var(--gold);
    color: #fff;
    text-align: center;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.01em;
    border-bottom: 2px solid var(--gold-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .cf-bar-code {
    background: rgba(0,0,0,0.18);
    padding: 3px 10px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 0.08em;
    font-weight: bold;
  }
  /* === Nav === */
  .cf-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 32px;
    background: #fff;
    border-bottom: 2px solid var(--border);
  }
  .cf-logo-link {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
  }
  .cf-logo-img {
    height: 64px;
    width: auto;
    display: block;
  }
  /* === Nav links === */
  .cf-nav-links {
    list-style: none;
    display: flex;
    gap: 28px;
    margin: 0;
    padding: 0;
    align-items: center;
  }
  .cf-nav-links li { list-style: none; }
  .cf-nav-links a {
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    transition: color 0.15s;
  }
  .cf-nav-links a:hover { color: var(--blue); }
  /* === Nav CTA (brand blue) === */
  .cf-nav-cta {
    display: inline-block;
    background: var(--blue);
    color: #fff !important;
    padding: 11px 22px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    border: 2px solid var(--blue-dark);
    box-shadow: 0 2px 0 var(--blue-dark);
    transition: background 0.15s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .cf-nav-cta:hover { background: var(--blue-dark); }
  .cf-nav-cta-short { display: none; }
  /* === Hamburger === */
  .cf-hamburger {
    display: none;
    background: #fff;
    border: 2px solid var(--border);
    width: 42px;
    height: 42px;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;
  }
  .cf-hamburger:hover { background: var(--bg-soft); }
  .cf-hamburger span {
    display: block;
    width: 20px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: transform 0.25s, opacity 0.25s;
  }
  .cf-hamburger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .cf-hamburger.active span:nth-child(2) { opacity: 0; }
  .cf-hamburger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  /* === Menu close button (mobile) === */
  .cf-menu-close-row { display: none; }
  .cf-menu-close {
    background: var(--bg-soft);
    border: 2px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 6px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  /* === Overlay (mobile menu backdrop) === */
  .cf-nav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
  }
  .cf-nav-overlay.show { display: block; }
  /* === Spacer (pushes page content below the fixed header) === */
  .cf-header-spacer { width: 100%; }
  /* === Mobile === */
  @media (max-width: 900px) {
    .cf-bar {
      font-size: 13px;
      padding: 10px 12px;
      gap: 8px;
    }
    .cf-bar-code { font-size: 12px; padding: 2px 8px; }
    .cf-nav {
      padding: 8px 14px;
      display: grid !important;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .cf-hamburger { display: flex; justify-self: start; order: 1; }
    .cf-logo-link { justify-self: center; order: 2; }
    .cf-nav-cta {
      justify-self: end;
      order: 3;
      padding: 10px 14px;
      font-size: 13px;
      white-space: nowrap;
    }
    .cf-nav-cta-full { display: none; }
    .cf-nav-cta-short { display: inline; }
    .cf-logo-img { height: 48px; }
    .cf-nav-links {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      bottom: 0 !important;
      width: 80% !important;
      max-width: 300px !important;
      height: 100vh !important;
      background: #fff !important;
      border-right: 2px solid var(--border) !important;
      flex-direction: column !important;
      padding: 16px 14px !important;
      margin: 0 !important;
      gap: 0 !important;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 240;
      box-shadow: 12px 0 32px rgba(0,0,0,0.18);
      overflow-y: auto;
      align-items: stretch !important;
    }
    .cf-nav-links.open { transform: translateX(0); }
    .cf-header.scrolled .cf-nav-links {
      transform: translateX(-100%) translateY(var(--cf-bar-h, 44px)) !important;
    }
    .cf-header.scrolled .cf-nav-links.open {
      transform: translateX(0) translateY(var(--cf-bar-h, 44px)) !important;
    }
    .cf-nav-links li {
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      display: block !important;
    }
    .cf-nav-links li.cf-menu-close-row {
      display: flex !important;
      justify-content: flex-start !important;
      margin: 0 0 10px 0 !important;
      padding: 2px 0 12px !important;
      border-bottom: 2px solid var(--border) !important;
    }
    .cf-nav-links a {
      display: block !important;
      padding: 14px 14px !important;
      font-size: 16px !important;
      font-weight: bold !important;
      color: var(--text) !important;
      border-radius: 6px !important;
      text-decoration: none !important;
      line-height: 1.3 !important;
      margin: 0 !important;
      width: 100% !important;
      border-bottom: 1px solid var(--border);
    }
    .cf-nav-links a:hover, .cf-nav-links a:active {
      background: var(--bg-soft) !important;
      color: var(--blue) !important;
    }
  }
</style>
<div class="cf-header-root">
  <div class="cf-header" id="cfHeader">
    <div class="cf-bar">
      🔥 LIMITED TIME: 80% Off The 3D Anatomy Atlas
      <span>· Plus</span>
      <span class="cf-bar-code" style="font-family:Arial, Helvetica, sans-serif; letter-spacing:.04em;">ALL 22 SUBJECTS FREE</span>
    </div>
    <nav class="cf-nav">
      <a href="#top" class="cf-logo-link">
        <img src="https://images.clickfunnels.com/cdn-cgi/image/width=500,fit=scale-down,f=auto,q=80/https://statics.myclickfunnels.com/workspace/JGWBNA/image/4150573/file/bcb87582999c5fe61a9435d02c3c647e.png"
             alt="MedSchoolZone"
             class="cf-logo-img">
      </a>
      <button class="cf-hamburger" id="cfHamburger" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="cf-nav-links" id="cfNavMenu">
        <li class="cf-menu-close-row">
          <button class="cf-menu-close" onclick="cfCloseMenu()" aria-label="Close menu">✕</button>
        </li>
        <li><a href="https://www.medschoolzone.com/" onclick="cfCloseMenu()">Home</a></li>
        <li><a href="https://www.medschoolzone.com/our-notes" onclick="cfCloseMenu()">Our Notes</a></li>
        <li><a href="https://www.medschoolzone.com/reviews" onclick="cfCloseMenu()">Reviews</a></li>
        <li><a href="https://www.medschoolzone.com/faqs" onclick="cfCloseMenu()">FAQ's</a></li>
        <li><a href="https://www.medschoolzone.com/contact" onclick="cfCloseMenu()">Contact Us</a></li>
        <li><a href="https://www.medschoolzone.com/contacts/sign_in" onclick="cfCloseMenu()">Sign In</a></li>
      </ul>
      <a href="#open-popup" class="cf-nav-cta">
        <span class="cf-nav-cta-full">Get The Atlas: $29 →</span>
        <span class="cf-nav-cta-short">Get Atlas →</span>
      </a>
    </nav>
  </div>
  <div class="cf-nav-overlay" id="cfNavOverlay" onclick="cfCloseMenu()"></div>
  <div class="cf-header-spacer" id="cfHeaderSpacer"></div>
</div>
<script>
  (function() {
    var hamburger = document.getElementById('cfHamburger');
    var navMenu = document.getElementById('cfNavMenu');
    var navOverlay = document.getElementById('cfNavOverlay');
    if (!hamburger) return;
    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('active');
      navMenu.classList.toggle('open');
      navOverlay.classList.toggle('show');
    });
    window.cfCloseMenu = function() {
      hamburger.classList.remove('active');
      navMenu.classList.remove('open');
      navOverlay.classList.remove('show');
    };
  })();
  (function() {
    var header = document.getElementById('cfHeader');
    var spacer = document.getElementById('cfHeaderSpacer');
    var bar = header && header.querySelector('.cf-bar');
    var navMenu = document.getElementById('cfNavMenu');
    if (!header) return;
    var lastScrollY = 0;
    var ticking = false;
    var cumulativeUpScroll = 0;
    var HIDE_AFTER = 150;
    var DELTA_THRESHOLD = 6;
    var SHOW_THRESHOLD = 110;
    var BAR_HIDE_THRESHOLD = 150;
    function getScrollY() {
      return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    }
    function syncBarHeight() {
      if (!bar) return;
      header.style.setProperty('--cf-bar-h', bar.offsetHeight + 'px');
    }
    function syncSpacer() {
      if (!spacer) return;
      spacer.style.height = header.offsetHeight + 'px';
    }
    syncBarHeight();
    syncSpacer();
    window.addEventListener('resize', function() { syncBarHeight(); syncSpacer(); }, { passive: true });
    window.addEventListener('load', function() { syncBarHeight(); syncSpacer(); });
    function setNavHidden(hidden) {
      if (hidden) {
        header.classList.add('nav-hidden');
      } else {
        header.classList.remove('nav-hidden');
        cumulativeUpScroll = 0;
      }
    }
    function updateHeader() {
      var currentScrollY = getScrollY();
      var scrollDelta = currentScrollY - lastScrollY;
      var isNavHidden = header.classList.contains('nav-hidden');
      var menuOpen = navMenu && navMenu.classList.contains('open');
      if (currentScrollY > BAR_HIDE_THRESHOLD) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
      if (menuOpen || currentScrollY < HIDE_AFTER) {
        setNavHidden(false);
      } else if (scrollDelta > DELTA_THRESHOLD) {
        setNavHidden(true);
        cumulativeUpScroll = 0;
      } else if (scrollDelta < -DELTA_THRESHOLD) {
        if (isNavHidden) {
          cumulativeUpScroll += Math.abs(scrollDelta);
          if (cumulativeUpScroll >= SHOW_THRESHOLD) setNavHidden(false);
        }
      }
      lastScrollY = currentScrollY;
      ticking = false;
    }
    function onScroll() {
      if (!ticking) {
        window.requestAnimationFrame(updateHeader);
        ticking = true;
      }
    }
    lastScrollY = getScrollY();
    updateHeader();
    window.addEventListener('scroll', onScroll, { passive: true, capture: true });
    document.addEventListener('scroll', onScroll, { passive: true, capture: true });
  })();
</script>
